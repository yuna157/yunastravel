function classify(name){return classifyCategory(name)||'기타'}
function classifyCategory(value){
  const x=String(value||'').toLowerCase();
  if(/호텔|숙소|모텔|게스트하우스|리조트|호스텔|hotel|hostel|lodging|accommodation|民宿|飯店/.test(x))return '숙소';
  if(/디저트|카페|커피|베이커리|빵집|제과|과자|차 전문|찻집|빙수|아이스크림|밀크티|로스터|roaster|tea shop|tea house|bakery|dessert|cafe|coffee|甜點|咖啡|茶店/.test(x))return '카페';
  if(/음식점|식당|요리|레스토랑|국수|우동|라멘|라면|딤섬|면관|훠궈|만두|해산물|스테이크|버거|치킨|분식|주점|브런치|야키토리|이자카야|restaurant|dining|food|cuisine|料理|餐廳|小吃/.test(x))return '식당';
  if(/쇼핑|상점|기념품|편집숍|소품|백화점|마트|매장|슈퍼마켓|서점|문구점|몰|shopping|souvenir|store|mall|bookstore|商店|市場/.test(x))return '쇼핑';
  if(/관광|명소|공원|박물관|미술관|전시|성당|사원|전망|해변|유적|유원지|산책|관람|attraction|museum|park|temple|景點|博物館/.test(x))return '관광';
  return null;
}
function stripMapsLine(value){return String(value||'').replace(/\*\*/g,'').replace(/^[•·]\s*/,'').replace(/\s+/g,' ').trim()}
function isMapsMeta(line){
  const x=stripMapsLine(line);
  return !x||/^(메모|메모 추가|노트|저장됨|저장|길찾기|웹사이트|공유|전화|영업 중|영업 종료|휴무|닫힘)$/.test(x)||
    /(?:^|\s)(?:NT\$|TWD|HK\$|US\$|₩|¥|€|\$)\s*[\d,]+/i.test(x)||
    /^(?:★|☆|[0-5][.,][0-9])\s*(?:점|\(|\/|$)/.test(x)||
    /(?:리뷰|후기|별점|영업시간|영업 중|영업 종료|예약|가격대|임시 휴업|휴업)/.test(x)||
    /^\d\s*성급\s*(?:호텔|리조트|모텔|게스트하우스|호스텔)$/.test(x)||
    /^(?:대만|한국|일본|중국|이탈리아|태국|베트남|프랑스|인도|독일|스페인|미국|영국)$|^(?:(?:대만|한국|일본|중국|이탈리아|태국|베트남|프랑스|인도|독일|스페인|미국|영국)\s*)?요리(?:\s*전문점)?$|^(?:카페|디저트|베이커리|음식점|식당|레스토랑|국수 전문점|쇼핑몰|기념품점|관광\s*명소|공원|해변|박물관|호텔)$/.test(x)||
    /^\d{4,6}\s+\S/.test(x)||/^(?:via|piazza|corso|calle|rue|avenue|street|road)\b/i.test(x);
}
function isValidPlaceName(name){const x=stripMapsLine(name);return /[\p{L}\p{N}]/u.test(x)&&!isMapsMeta(x)}
function parseGooglePlaces(text){
  const lines=String(text||'').split(/\r?\n/).map(stripMapsLine).filter(Boolean);
  const structured=lines.some(isMapsMeta),found=[],seen=new Set();
  let current=null;
  const flush=()=>{if(current&&isValidPlaceName(current.name)&&!seen.has(current.name.toLowerCase())){seen.add(current.name.toLowerCase());found.push(current)}current=null};
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(/^(메모|메모 추가|노트)$/.test(line))continue;
    if(isMapsMeta(line)){
      if(current&&!current.category){
        // A category line has priority over any clue in the shop name.
        current.category=classifyCategory(line);
      }
      continue;
    }
    if(structured){
      const next=lines[i+1]||'';
      // Ignore unrelated memo text; a shop name is followed by Google metadata.
      if(!isMapsMeta(next))continue;
    }
    flush();
    current={name:line,category:null};
  }
  flush();
  return found.map(x=>({name:x.name,category:x.category||classify(x.name)}));
}
function parseKakaoPlaces(text){
  const lines=String(text||'').split(/\r?\n/).map(line=>line.trim()),found=[],seen=new Set();
  for(let i=0;i<lines.length;i++){
    if(!/^(?:[-•]\s*)?장소$/.test(lines[i]))continue;
    const nameLine=lines.slice(i+1).find(line=>line&&!/^더보기$/.test(line));
    if(!nameLine)continue;
    const match=nameLine.match(/\[\*\*(.+?)\*\*\]\([^)]*\)/);
    const name=stripMapsLine(match?match[1]:nameLine);
    if(name&&!seen.has(name.toLowerCase())){seen.add(name.toLowerCase());found.push({name,category:classify(name)})}
  }
  return found;
}
function parsePlaces(text){const kakao=parseKakaoPlaces(text);return kakao.length?kakao:parseGooglePlaces(text)}

  const note=document.getElementById('cityNote').value.trim(),flag=document.getElementById('cityFlag').value.trim()||knownFlagForCity(clean)||'🌍',yearsText=document.getElementById('cityYears').value.trim(),visitCountText=document.getElementById('cityVisitCount').value.trim();
  if(!clean){input.focus();return}
  const years=(yearsText.match(/\d{4}/g)||[]).map(Number).filter(y=>y>=1900&&y<=2100).sort((a,b)=>a-b);
  if(visited&&yearsText&&!years.length){alert('방문 연도는 네 자리 숫자로 입력해 주세요.');document.getElementById('cityYears').focus();return}
  const visitCount=visitCountText?Number(visitCountText):years.length;
  if(visited&&visitCountText&&(!Number.isInteger(visitCount)||visitCount<1)){alert('방문 횟수는 1 이상의 숫자로 입력해 주세요.');document.getElementById('cityVisitCount').focus();return}
  const editing=state.editingCityId?state.data.cities[type].find(c=>c.id===state.editingCityId):null;
  const duplicate=[...state.data.cities.visited,...state.data.cities.want].find(c=>c.name===clean&&c.id!==editing?.id);
  if(duplicate){alert('이미 등록된 도시예요.');input.focus();return}
  if(editing){editing.name=clean;editing.flag=flag;editing.note=note;if(visited){editing.years=years;editing.visitCount=visitCount}state.data.trips.filter(trip=>trip.cityId===editing.id).forEach(trip=>{if(!Array.isArray(trip.cityIds)||trip.cityIds.length<=1)trip.city=clean;trip.flag=flag})}
  else state.data.cities[type].push({id:uid('city'),name:clean,flag,note,years:visited?years:undefined,visitCount:visited?visitCount:undefined});
  save();closeCityModal();renderCities();
}
function deleteCity(type,id){const c=state.data.cities[type].find(x=>x.id===id);if(!c||!confirm(`${c.name} 도시를 삭제할까요? 여행 기록은 남아 있어요.`))return;if(protectedChange('도시 삭제 전',()=>{state.data.cities[type]=state.data.cities[type].filter(x=>x.id!==id);state.data.trips.forEach(trip=>{if(trip.cityId===id)trip.cityId=null;if(Array.isArray(trip.cityIds))trip.cityIds=trip.cityIds.filter(cityId=>cityId!==id)})}))renderCities()}
function cityHistoryById(id,push=true){
  const c=state.data.cities.visited.find(x=>x.id===id);if(!c)return renderCities();
  state.page='cities';state.cityHistoryId=id;nav();
  const trips=state.data.trips.filter(t=>(Array.isArray(t.cityIds)&&t.cityIds.includes(c.id))||t.cityId===c.id||(!t.cityId&&t.city===c.name)),years=c.years||[],visitCount=Number.isInteger(c.visitCount)&&c.visitCount>0?c.visitCount:years.length,details=[years.length?`방문 연도 ${years.join(' · ')}`:'',visitCount?`${visitCount}회`:'',c.note||''].filter(Boolean).join(' · ');
  main.innerHTML=`<div class="section-title"><button class="text-btn" onclick="showPage('cities')">← 도시 목록</button></div><div class="card"><div class="city">${esc(c.flag||flagForCity(c.name))} ${esc(c.name)}</div>${details?`<div class="date">${esc(details)}</div>`:''}</div>${trips.length?trips.map(t=>`<div class="card history-card" onclick="openTrip('${t.id}')"><div class="city">${esc(t.date)}</div><div class="date">여행 기록 보기 →</div></div>`).join(''):'<div class="empty">앱에 작성한 여행 기록은 아직 없어요.</div>'}`;
  if(push)pushRoute();
}
function cityHistory(city){const c=state.data.cities.visited.find(x=>x.name===city);if(c)cityHistoryById(c.id)}
function exportTripText(){
  const t=currentTrip();if(!t)return;
  const lines=["YUNA'S TRAVEL",'',`도시: ${t.flag||flagForCity(t.city)} ${t.city}`,`기간: ${t.date||'날짜 미정'}`,''];
  (t.diaryDays||[]).forEach((day,index)=>{lines.push(`DAY ${index+1} · ${diaryDateLabel(t,index)}${day.city?` · ${day.city}`:''}`);if(day.note?.trim())lines.push(day.note.trim());lines.push('')});
  const blob=new Blob([lines.join('\n').trimEnd()+'\n'],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`${t.city.replace(/[\\/:*?"<>|]/g,'_')}_여행기록.txt`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);
}

let checklistEditing={};
function checkEditIcons(id){
  return `<div class="item-actions"><button class="check-edit-btn" aria-label="항목 수정" onclick="editChecklist('${id}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1L20 7l-3-3L5 16zM14 7l3 3"/></svg></button><button class="check-edit-btn" aria-label="항목 삭제" onclick="deleteChecklist('${id}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg></button></div>`;
}
function renderChecklist(){
  const items=state.data.checklist.items;
  const group=(key,label)=>{
    const rows=items.filter(x=>x.group===key),editing=!!checklistEditing[key];
    return `<section class="check-group" data-check-group="${key}"><div class="section-title"><span>${label} <span class="muted" id="check-count-${key}">${rows.filter(x=>x.checked).length}/${rows.length}</span></span><div class="section-actions"><button class="text-btn" onclick="resetChecklist('${key}')">체크 해제</button><button class="text-btn" aria-pressed="${editing}" onclick="toggleChecklistEdit('${key}')">${editing?'완료':'편집'}</button></div></div><div class="card">${rows.map(x=>`<div class="check-row"><label class="check-label"><input type="checkbox" ${x.checked?'checked':''} onchange="toggleChecklist('${x.id}',this.checked)"><span class="name">${esc(x.name)}</span></label>${editing?checkEditIcons(x.id):''}</div>`).join('')||'<div class="empty">아직 항목이 없어요.</div>'}<div class="check-add"><input id="check-item-${key}" class="field" aria-label="${label} 추가" placeholder="항목 추가" onkeydown="if(event.key==='Enter'&&!event.isComposing)addChecklist('${key}')"><button class="small-btn soft" onclick="addChecklist('${key}')">＋</button></div></div></section>`;
  };
  main.innerHTML=`<section class="section"><div class="section-title"><span>여행 체크리스트</span><span class="muted">자동 저장</span></div>${Object.entries(CHECK_GROUPS).map(([key,label])=>group(key,label)).join('')}<div class="notice" id="notice"></div><div class="section data-section"><div class="section-title">DATA BACKUP</div><div class="data-actions"><button class="data-btn" onclick="backupAllData()">백업하기</button><button class="data-btn" onclick="document.getElementById('restoreFile').click()">복원하기</button><button class="data-btn" onclick="restoreSafetyCopy()">보호 사본 복원</button></div><p class="safety-note">삭제·체크 해제·복원 직전의 보호 사본 1개를 보관해요. 기기를 바꾸거나 브라우저 데이터를 지우기 전에는 JSON 백업을 내려받아 주세요.</p><input id="restoreFile" type="file" accept="application/json,.json" hidden onchange="restoreAllData(event)"></div></section>`;
}
function toggleChecklistEdit(group){checklistEditing[group]=!checklistEditing[group];renderChecklist()}
function addChecklist(group='packing'){const input=document.getElementById(`check-item-${group}`),name=input.value.trim();if(!name||!Object.hasOwn(CHECK_GROUPS,group))return;if(state.data.checklist.items.some(x=>x.group===group&&x.name===name)){input.focus();return}state.data.checklist.items.push({id:uid('check'),name,checked:false,group});save();renderChecklist();setTimeout(()=>document.getElementById(`check-item-${group}`)?.focus(),0)}
function toggleChecklist(id,checked){const x=state.data.checklist.items.find(x=>x.id===id);if(!x)return;x.checked=checked;save();const rows=state.data.checklist.items.filter(item=>item.group===x.group);document.getElementById('check-count-'+x.group).textContent=rows.filter(item=>item.checked).length+'/'+rows.length}
function editChecklist(id){const x=state.data.checklist.items.find(x=>x.id===id);if(!x)return;const name=prompt('항목 이름',x.name);if(name===null||!name.trim())return;x.name=name.trim();save();renderChecklist()}
function deleteChecklist(id){if(protectedChange('체크리스트 항목 삭제 전',()=>{state.data.checklist.items=state.data.checklist.items.filter(x=>x.id!==id)}))renderChecklist()}
function resetChecklist(group){if(!Object.hasOwn(CHECK_GROUPS,group)||!state.data.checklist.items.some(x=>x.group===group&&x.checked))return;if(!confirm(`${CHECK_GROUPS[group]}의 체크를 모두 해제할까요?`))return;if(protectedChange(CHECK_GROUPS[group]+' 체크 해제 전',()=>{state.data.checklist.items.filter(x=>x.group===group).forEach(x=>x.checked=false)}))renderChecklist()}

function backupAllData(){
  try{
    const backup={app:'YUNAS_TRAVEL',backupVersion:1,exportedAt:new Date().toISOString(),data:state.data};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date();
    a.href=url;a.download=`yunas-travel-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){console.error(e);alert('백업 파일을 만드는 중 문제가 생겼어요.')}
}
function validBackup(data){
  const idOK=id=>typeof id==='string'&&/^[A-Za-z0-9_-]+$/.test(id);
  const itemOK=x=>x&&idOK(x.id)&&typeof x.name==='string';
  return !!data&&typeof data==='object'&&!Array.isArray(data)&&Array.isArray(data.trips)&&
    data.trips.every(t=>t&&idOK(t.id)&&typeof t.city==='string'&&Array.isArray(t.places)&&
      t.places.every(p=>itemOK(p)&&typeof p.category==='string')&&
      Array.isArray(t.days)&&t.days.every(d=>d&&Array.isArray(d.items)&&d.items.every(idOK))&&
      (t.diaryDays===undefined||(Array.isArray(t.diaryDays)&&t.diaryDays.every(d=>d&&typeof d.note==='string'&&(d.city===undefined||typeof d.city==='string')))))&&
    data.cities&&['want','visited'].every(key=>Array.isArray(data.cities[key])&&data.cities[key].every(c=>itemOK(c)&&(c.years===undefined||Array.isArray(c.years))))&&
    data.checklist&&((Array.isArray(data.checklist.items)&&data.checklist.items.every(itemOK))||
      (Array.isArray(data.checklist.국내)&&Array.isArray(data.checklist.해외)&&[...data.checklist.국내,...data.checklist.해외].every(x=>x&&typeof x.name==='string')));
}
async function restoreAllData(event){
  const input=event.target,file=input.files?.[0];if(!file)return;
  let stage='read';
  try{
    if(file.size>5*1024*1024)throw Error('oversize');
    const backup=JSON.parse(await file.text());
    if(backup?.app!=='YUNAS_TRAVEL'||backup.backupVersion!==1)throw Error('invalid backup');
    const data=prepareData(backup.data);
    if(!confirm(`여행 ${data.trips.length}개 · 도시 ${data.cities.visited.length+data.cities.want.length}개 · 체크 항목 ${data.checklist.items.length}개를 복원할까요? 현재 데이터는 보호 사본으로 남깁니다.`))return;
    stage='write';
    const previous=localStorage.getItem(STORE);
    if(storageReady&&previous!==lastStored)throw Error('conflict');
    safetyCopy(storageReady?JSON.stringify(state.data):previous,'백업 복원 전');
    localStorage.setItem(STORE,JSON.stringify(data));
    location.reload();
  }catch(e){alert(e.message==='conflict'?'다른 창의 데이터가 바뀌어 복원을 중단했어요. 현재 내용을 먼저 백업해 주세요.':stage==='read'?'백업 파일을 읽지 못했어요. 파일 형식을 확인해 주세요. 기존 데이터는 유지됩니다.':'저장 공간을 사용할 수 없어 복원하지 못했어요. 기존 데이터는 유지됩니다.')}
  finally{input.value=''}
}
if(load()){showPage('home',false);setupNavigation()}else recoveryScreen();
window.addEventListener('resize',()=>document.querySelectorAll('.diary-note').forEach(growDiaryNote));
window.addEventListener('beforeunload',event=>{if(storageReady&&JSON.stringify(state.data)!==lastStored){event.preventDefault();event.returnValue=''}});
</script></body></html>
