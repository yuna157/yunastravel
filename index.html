<div class="modal-back" id="cityModal"><div class="modal"><h3 id="cityModalTitle">도시 추가</h3><input id="cityName" class="field" placeholder="도시 이름" oninput="suggestCityFlag()"><label class="field-label" for="cityFlag">국기</label><input id="cityFlag" class="field" placeholder="자동 분류 · 직접 수정 가능" maxlength="8" aria-label="국기 이모티콘"><div id="cityNoteGroup"><label class="field-label" for="cityNote">메모 (선택)</label><input id="cityNote" class="field"></div><div id="cityYearsGroup" style="display:none"><label class="field-label" for="cityYears">방문 연도</label><input id="cityYears" class="field" inputmode="numeric"></div><div id="cityVisitCountGroup" style="display:none"><label class="field-label" for="cityVisitCount">방문 횟수</label><input id="cityVisitCount" class="field" inputmode="numeric" placeholder="예: 2"></div><div class="modal-actions"><button class="secondary" onclick="closeCityModal()">취소</button><button class="primary" id="citySaveButton" onclick="saveCity()">추가</button></div></div></div>

function newChecklistItems(checkedNames=new Set()){return CHECKLIST_DEFAULTS.map(name=>({id:uid('check'),name,checked:checkedNames.has(name)}))}
function normalizeChecklist(data){
  const checklist=data.checklist||{};
  if(Array.isArray(checklist.items)){
    checklist.items=checklist.items.filter(x=>x&&typeof x.name==='string').map(x=>({id:x.id||uid('check'),name:x.name,checked:!!x.checked,group:x.group==='inspection'||/쓰레기통 비우기|싱크대 배수구 비우기|창문 닫기|환풍기 끄기|콘센트 끄기|커피머신 청소하기/.test(x.name)?'inspection':'packing'}));
    data.checklist=checklist;return;
  }
  const old=[...(Array.isArray(checklist.국내)?checklist.국내:[]),...(Array.isArray(checklist.해외)?checklist.해외:[])];
  const checked=new Set(old.filter(x=>x&&x.checked).map(x=>x.name));

function classify(name){return classifyCategory(name)||'기타'}
function classifyCategory(value){
  const x=String(value||'').toLowerCase();
  if(/호텔|숙소|모텔|게스트하우스|리조트|호스텔|hotel|hostel|lodging|accommodation|民宿|飯店/.test(x))return '숙소';

  if(/음식점|식당|요리|레스토랑|국수|우동|라멘|라면|딤섬|면관|훠궈|만두|해산물|스테이크|버거|치킨|분식|주점|브런치|야키토리|이자카야|restaurant|dining|food|cuisine|料理|餐廳|小吃/.test(x))return '식당';
  if(/쇼핑|상점|기념품|편집숍|소품|백화점|마트|매장|슈퍼마켓|서점|문구점|몰|shopping|souvenir|store|mall|bookstore|商店|市場/.test(x))return '쇼핑';
  if(/관광|명소|공원|박물관|미술관|전시|성당|사원|전망|해변|유적|유원지|산책|관람|attraction|museum|park|temple|景點|博物館/.test(x))return '관광';
  return null;
}
function stripMapsLine(value){return String(value||'').replace(/\*\*/g,'').replace(/^[•·]\s*/,'').replace(/\s+/g,' ').trim()}
function isMapsMeta(line){
  const x=stripMapsLine(line);
  return !x||/^(메모|메모 추가|노트|저장됨|저장|길찾기|웹사이트|공유|전화|영업 중|영업 종료|휴무|닫힘)$/.test(x)||
    /(?:^|\s)(?:NT\$|TWD|HK\$|US\$|₩|¥|€|\$)\s*[\d,]+/i.test(x)||
    /^(?:★|☆|[0-5][.,][0-9])\s*(?:점|\(|\/|$)/.test(x)||
    /(?:리뷰|후기|별점|영업시간|영업 중|영업 종료|예약|가격대|임시 휴업|휴업)/.test(x)||
    /^\d\s*성급\s*(?:호텔|리조트|모텔|게스트하우스|호스텔)$/.test(x)||
    /^(?:대만|한국|일본|중국|이탈리아|태국|베트남|프랑스|인도|독일|스페인|미국|영국)$|^(?:(?:대만|한국|일본|중국|이탈리아|태국|베트남|프랑스|인도|독일|스페인|미국|영국)\s*)?요리(?:\s*전문점)?$|^(?:카페|디저트|베이커리|음식점|식당|레스토랑|국수 전문점|쇼핑몰|기념품점|관광\s*명소|공원|해변|박물관|호텔)$/.test(x)||
    /^\d{4,6}\s+\S/.test(x)||/^(?:via|piazza|corso|calle|rue|avenue|street|road)\b/i.test(x);
}
function isValidPlaceName(name){const x=stripMapsLine(name);return /[\p{L}\p{N}]/u.test(x)&&!isMapsMeta(x)}
function parseGooglePlaces(text){
  const lines=String(text||'').split(/\r?\n/).map(stripMapsLine).filter(Boolean);
  const structured=lines.some(isMapsMeta),found=[],seen=new Set();
  let current=null;
  const flush=()=>{if(current&&isValidPlaceName(current.name)&&!seen.has(current.name.toLowerCase())){seen.add(current.name.toLowerCase());found.push(current)}current=null};
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(/^(메모|메모 추가|노트)$/.test(line))continue;
    if(isMapsMeta(line)){
      if(current&&!current.category){
        // A category line has priority over any clue in the shop name.
        current.category=classifyCategory(line);
      }
      continue;
    }
    if(structured){
      const next=lines[i+1]||'';
      // Ignore unrelated memo text; a shop name is followed by Google metadata.
      if(!isMapsMeta(next))continue;
    }
    flush();
    current={name:line,category:null};
  }
  flush();
  return found.map(x=>({name:x.name,category:x.category||classify(x.name)}));
}
function parseKakaoPlaces(text){
  const lines=String(text||'').split(/\r?\n/).map(line=>line.trim()),found=[],seen=new Set();
  for(let i=0;i<lines.length;i++){
    if(!/^(?:[-•]\s*)?장소$/.test(lines[i]))continue;
    const nameLine=lines.slice(i+1).find(line=>line&&!/^더보기$/.test(line));
    if(!nameLine)continue;
    const match=nameLine.match(/\[\*\*(.+?)\*\*\]\([^)]*\)/);
    const name=stripMapsLine(match?match[1]:nameLine);
    if(name&&!seen.has(name.toLowerCase())){seen.add(name.toLowerCase());found.push({name,category:classify(name)})}
  }
  return found;
}

  document.getElementById('cityFlag').value=city?.flag||knownFlagForCity(city?.name||'');
  document.getElementById('cityNote').value=city?.note||'';
  document.getElementById('cityYears').value=city?.years?.join(', ')||'';
  document.getElementById('cityVisitCount').value=visited?(city?.visitCount??(city?.years?.length||'')):'';
  document.getElementById('cityNoteGroup').style.display='block';
  document.getElementById('cityYearsGroup').style.display=visited?'block':'none';
  document.getElementById('cityVisitCountGroup').style.display=visited?'block':'none';
  document.getElementById('cityModal').style.display='flex';input.focus();
}
function closeCityModal(){document.getElementById('cityModal').style.display='none';state.editingCityId=null}
function suggestCityFlag(){const flagInput=document.getElementById('cityFlag'),name=document.getElementById('cityName').value.trim();if(flagInput.value.trim()||!name)return;const detected=knownFlagForCity(name);if(detected)flagInput.value=detected}
function saveCity(){
  const input=document.getElementById('cityName'),clean=input.value.trim(),type=state.cityAddType,visited=type==='visited';
  const note=document.getElementById('cityNote').value.trim(),flag=document.getElementById('cityFlag').value.trim()||knownFlagForCity(clean)||'🌍',yearsText=document.getElementById('cityYears').value.trim(),visitCountText=document.getElementById('cityVisitCount').value.trim();
  if(!clean){input.focus();return}
  const years=(yearsText.match(/\d{4}/g)||[]).map(Number).filter(y=>y>=1900&&y<=2100).sort((a,b)=>a-b);
  if(visited&&yearsText&&!years.length){alert('방문 연도는 네 자리 숫자로 입력해 주세요.');document.getElementById('cityYears').focus();return}
  const visitCount=visitCountText?Number(visitCountText):years.length;
  if(visited&&visitCountText&&(!Number.isInteger(visitCount)||visitCount<1)){alert('방문 횟수는 1 이상의 숫자로 입력해 주세요.');document.getElementById('cityVisitCount').focus();return}
  const editing=state.editingCityId?state.data.cities[type].find(c=>c.id===state.editingCityId):null;
  const duplicate=[...state.data.cities.visited,...state.data.cities.want].find(c=>c.name===clean&&c.id!==editing?.id);
  if(duplicate){alert('이미 등록된 도시예요.');input.focus();return}
  if(editing){editing.name=clean;editing.flag=flag;editing.note=note;if(visited){editing.years=years;editing.visitCount=visitCount}state.data.trips.filter(trip=>trip.cityId===editing.id).forEach(trip=>{if(!Array.isArray(trip.cityIds)||trip.cityIds.length<=1)trip.city=clean;trip.flag=flag})}
  else state.data.cities[type].push({id:uid('city'),name:clean,flag,note,years:visited?years:undefined,visitCount:visited?visitCount:undefined});
  save();closeCityModal();renderCities();
}
function deleteCity(type,id){const c=state.data.cities[type].find(x=>x.id===id);if(!c)return;state.data.cities[type]=state.data.cities[type].filter(x=>x.id!==id);state.data.trips.forEach(trip=>{if(trip.cityId===id)trip.cityId=null;if(Array.isArray(trip.cityIds))trip.cityIds=trip.cityIds.filter(cityId=>cityId!==id)});save();renderCities()}
function cityHistoryById(id,push=true){
  const c=state.data.cities.visited.find(x=>x.id===id);if(!c)return renderCities();
  state.page='cities';state.cityHistoryId=id;nav();
  const trips=state.data.trips.filter(t=>(Array.isArray(t.cityIds)&&t.cityIds.includes(c.id))||t.cityId===c.id||(!t.cityId&&t.city===c.name)),years=c.years||[],visitCount=Number.isInteger(c.visitCount)&&c.visitCount>0?c.visitCount:years.length,details=[years.length?`방문 연도 ${years.join(' · ')}`:'',visitCount?`${visitCount}회`:'',c.note||''].filter(Boolean).join(' · ');
  main.innerHTML=`<div class="section-title"><button class="text-btn" onclick="showPage('cities')">← 도시 목록</button></div><div class="card"><div class="city">${esc(c.flag||flagForCity(c.name))} ${esc(c.name)}</div>${details?`<div class="date">${esc(details)}</div>`:''}</div>${trips.length?trips.map(t=>`<div class="card history-card" onclick="openTrip('${t.id}')"><div class="city">${esc(t.date)}</div><div class="date">여행 기록 보기 →</div></div>`).join(''):'<div class="empty">앱에 작성한 여행 기록은 아직 없어요.</div>'}`;
  if(push)pushRoute();
}
function cityHistory(city){const c=state.data.cities.visited.find(x=>x.name===city);if(c)cityHistoryById(c.id)}
function exportTripText(){
  const t=currentTrip();if(!t)return;
  const lines=["YUNA'S TRAVEL",'',`도시: ${t.flag||flagForCity(t.city)} ${t.city}`,`기간: ${t.date||'날짜 미정'}`,''];
  (t.diaryDays||[]).forEach((day,index)=>{lines.push(`DAY ${index+1} · ${diaryDateLabel(t,index)}${day.city?` · ${day.city}`:''}`);if(day.note?.trim())lines.push(day.note.trim());lines.push('')});
  const blob=new Blob([lines.join('\n').trimEnd()+'\n'],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`${t.city.replace(/[\\/:*?"<>|]/g,'_')}_여행기록.txt`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);
}

function renderChecklist(){
  const items=state.data.checklist.items;
  const group=(key,label,placeholder)=>{const rows=items.filter(x=>x.group===key);return `<div class="check-group"><div class="section-title"><span>${label} <span class="muted">${rows.length}</span></span></div><div class="card"><div class="check-add"><input id="check-item-${key}" class="field" placeholder="${placeholder}" onkeydown="if(event.key==='Enter')addChecklist('${key}')"><button class="small-btn soft" onclick="addChecklist('${key}')">＋ 추가</button></div>${rows.map(x=>`<div class="check-row"><input type="checkbox" ${x.checked?'checked':''} onchange="toggleChecklist('${x.id}',this.checked)"><span class="name">${esc(x.name)}</span><div class="item-actions"><button onclick="editChecklist('${x.id}')">수정</button><button onclick="deleteChecklist('${x.id}')">삭제</button></div></div>`).join('')||'<div class="empty">아직 항목이 없습니다.</div>'}</div></div>`};
  main.innerHTML=`<section class="section"><div class="section-title"><span>여행 체크리스트 <span class="muted">${items.length}</span></span><div class="actions"><button class="small-btn soft" onclick="saveChecklist()">저장</button><button class="small-btn" onclick="resetChecklist()">초기화</button></div></div>${group('packing','준비물','준비물 직접 추가')}${group('inspection','점검사항','점검사항 직접 추가')}<div class="notice" id="notice"></div><div class="section data-section"><div class="section-title">DATA BACKUP</div><div class="data-desc">여행, 장소 메모, 방문 도시와 가고 싶은 도시, 체크리스트 등 앱의 모든 저장 데이터를 JSON 파일 하나로 백업하고 복원할 수 있어요.</div><div class="data-actions"><button class="data-btn" onclick="backupAllData()">백업하기</button><button class="data-btn" onclick="document.getElementById('restoreFile').click()">복원하기</button></div><input id="restoreFile" type="file" accept="application/json,.json" hidden onchange="restoreAllData(event)"></div></section>`
}
function addChecklist(group='packing'){const input=document.getElementById(`check-item-${group}`),name=input.value.trim();if(!name)return;if(state.data.checklist.items.some(x=>x.name===name)){input.focus();return}state.data.checklist.items.push({id:uid('check'),name,checked:false,group});save();renderChecklist();setTimeout(()=>document.getElementById(`check-item-${group}`)?.focus(),0)}
function toggleChecklist(id,checked){const x=state.data.checklist.items.find(x=>x.id===id);if(!x)return;x.checked=checked;save()}
function editChecklist(id){const x=state.data.checklist.items.find(x=>x.id===id),name=prompt('준비물 이름',x?.name);if(!x||name===null||!name.trim())return;x.name=name.trim();save();renderChecklist()}
function deleteChecklist(id){const x=state.data.checklist.items.find(x=>x.id===id);if(!x)return;state.data.checklist.items=state.data.checklist.items.filter(x=>x.id!==id);save();renderChecklist()}
function saveChecklist(){save();const n=document.getElementById('notice');n.textContent='✓ 저장되었습니다';setTimeout(()=>{if(n)n.textContent=''},1500)}
function resetChecklist(){state.data.checklist.items.forEach(x=>x.checked=false);save();renderChecklist()}

function backupAllData(){
  try{
    if(!save())return;
    const backup={app:'YUNAS_TRAVEL',backupVersion:1,exportedAt:new Date().toISOString(),data:state.data};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date();
    a.href=url;a.download=`yunas-travel-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){console.error(e);alert('백업 파일을 만드는 중 문제가 생겼어요.')}
}
function validBackup(data){
  return !!data&&typeof data==='object'&&!Array.isArray(data)&&Array.isArray(data.trips)&&
    data.trips.every(t=>t&&typeof t.id==='string'&&typeof t.city==='string'&&Array.isArray(t.places)&&
      t.places.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&typeof p.category==='string')&&
      Array.isArray(t.days)&&t.days.every(d=>d&&Array.isArray(d.items)&&d.items.every(id=>typeof id==='string')))&&
    data.cities&&Array.isArray(data.cities.want)&&Array.isArray(data.cities.visited)&&
    data.checklist&&(Array.isArray(data.checklist.items)||(Array.isArray(data.checklist.국내)&&Array.isArray(data.checklist.해외)));
}
async function restoreAllData(event){
  const input=event.target,file=input.files?.[0];if(!file)return;
  try{
    if(file.size>5*1024*1024)throw Error('oversize');
    const backup=JSON.parse(await file.text());
    if(backup?.app!=='YUNAS_TRAVEL'||backup.backupVersion!==1||!validBackup(backup.data))throw Error('invalid backup');
    const previous=localStorage.getItem(STORE);
    try{localStorage.setItem(STORE,JSON.stringify(backup.data))}catch(e){if(previous!==null)try{localStorage.setItem(STORE,previous)}catch(_){}throw e}
    alert('복원이 완료됐어요. 앱을 다시 불러옵니다.');location.reload();
  }catch(e){console.error(e);alert('YUNA\'S TRAVEL 백업 파일이 아니거나 파일이 손상됐어요.')}
  finally{input.value=''}
}
load();showPage('home',false);setupNavigation();
</script></body></html>
